[workspace]
resolver = "3"
members = [
    "crates/spec-check-core",
    "crates/spec-check-analyses",
    "crates/cargo-spec-check",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
spec-check-core = { path = "crates/spec-check-core" }
spec-check-analyses = { path = "crates/spec-check-analyses" }

[profile.release]
debug = true
